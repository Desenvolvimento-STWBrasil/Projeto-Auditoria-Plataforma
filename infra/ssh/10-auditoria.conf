# /infra/ssh/10-auditoria.conf — SSH só com chave (INFRA-05)
#
# Na VM: /etc/ssh/sshd_config.d/10-auditoria.conf. O sshd usa o PRIMEIRO
# valor que encontra; o "10-" faz este arquivo ser lido antes dos drop-ins
# do Debian/cloud (ex.: 50-cloud-init.conf). Confira com: sudo sshd -T
#
# Sem AllowUsers de propósito: a TI precisa conseguir entrar com uma chave
# cadastrada pelo console da GCP (metadados) se a sua chave se perder.
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
AuthenticationMethods publickey
PermitRootLogin no
MaxAuthTries 3
# Túnel -L (acesso ao staging/produção) continua funcionando; -R e
# encaminhamento de agente/X11 ficam desligados.
AllowTcpForwarding local
AllowAgentForwarding no
X11Forwarding no

# /infra/edge/conf.d/00-geral.conf — valores comuns a todos os ambientes
#
# Incluído no bloco http do nginx.conf da imagem (lido antes dos outros
# .conf por causa do "00-").

# DNS interno do Docker, consultado a cada requisição (proxy_pass com
# variável, nos arquivos de cada ambiente). Assim o nginx sobe mesmo com
# um ambiente fora do ar e acompanha o IP novo do container depois de
# cada deploy, em vez de guardar o IP antigo e responder 502.
resolver 127.0.0.11 valid=10s ipv6=off;

server_tokens off;

# Upload de evidência: 10 MB no backend + folga do multipart.
# Manter alinhado com next.config.ts.
client_max_body_size 12M;

proxy_connect_timeout 10s;
proxy_send_timeout 60s;
proxy_read_timeout 60s;
proxy_http_version 1.1;

gzip on;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

# Rate limit do login (usado no prod.conf). 1 MB guarda ~16 mil IPs.
# Abaixo dos 5/min do backend, que valem para todos juntos (DT-SEC-04).
limit_req_zone $binary_remote_addr zone=login:1m rate=2r/m;
limit_req_status 429;

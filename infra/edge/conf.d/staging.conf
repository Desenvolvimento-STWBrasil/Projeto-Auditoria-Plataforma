# /infra/edge/conf.d/staging.conf — staging em 127.0.0.1:8081 (ADR-001 D6)
#
# Acesso só por túnel: ssh -L 8081:localhost:8081 auditoria-vm
# e no navegador http://localhost:8081 (igual ao APP_URL do .env).
server {
    listen 8081;
    server_name _;

    set $frontend http://auditoria-staging-frontend:3000;
    set $backend http://auditoria-staging-backend:8000;

    # X-Forwarded-Host com a porta (localhost:8081): Next.js
    # compara com o Origin do navegador nas Server Actions
    proxy_set_header Host                   $host;
    proxy_set_header X-Forwarded-host       $http_host;
    proxy_set_header X-Real-IP              $remote_addr;
    proxy_set_header X-Forwarded-For        $remote_addr;
    proxy_set_header X-Forwarded-Proto      $scheme;

    location / {
        proxy_pass $frontend;
    }

    # Só no staging: saúde do backend e Swagger (ADR-001 D3)
    location = /health          { proxy_pass $backend; }
    location = /docs            { proxy_pass $backend; }
    location = /redoc           { proxy_pass $backend; }
    location = /openapi.json    { proxy_pass $backend; }
    # "Try it out" do Swagger: a /docs chama /api/v1/... no mesmo endereço.
    # Só no staging: na produção a API fica atrás do BFF.
    location /api/v1/           { proxy_pass $backend; }

    # Healthcheck do próprio container do edge
    location = /edge-health {
        access_log off;
        return 200 "ok\n";
    }
}

# /infra/edge/conf.d/prod.conf — produção (ADR-001 D6, D8)
#
# Dois servidores com o mesmo conteúdo e regras de acesso diferentes:
#   :8080  túnel SSH. A porta só existe em 127.0.0.1 da VM (compose.edge.yml):
#          ssh -N -L 8080:localhost:8080 auditoria-vm e http://localhost:8080
#   :80    sem túnel. Só os IPs de /srv/auditoria/edge/allow/*.allow (fora do Git).
#          Pasta vazia = ninguém entra por aqui.
# O :80 não libera o gateway da rede Docker de propósito: por ele também
# chegam conexões de containers desviadas pelo docker-proxy.
# Sem /docs, /redoc, /openapi.json nem /health (DT-SEC-09).

server {
    listen 8080;
    server_name _;

    # Túnel SSH: o nginx vê o gateway da rede Docker (compose.edge.yml).
    # Os containers (.2 em diante) recebem 403.
    allow 172.30.1.1;
    allow 172.30.2.1;
    deny all;

    set $frontend http://auditoria-prod-frontend:3000;

    # Mesmos cabeçalhos do staging.conf (ver comentário lá)
    proxy_set_header Host                 $host;
    proxy_set_header X-Forwarded-Host     $http_host;
    proxy_set_header X-Real-IP            $remote_addr;
    proxy_set_header X-Forwarded-For      $remote_addr;
    proxy_set_header X-Forwarded-Proto    $scheme;

    location / {
        proxy_pass $frontend;
    }

    # Login: 2 tentativas por minuto por IP, com folga de 1 (DT-SEC-04).
    # Abaixo do limite do backend (5/min para todos juntos): um IP sozinho
    # não trava o login dos outros. Pelo túnel, todos dividem o mesmo IP.
    location = /api/auth/login {
        limit_req zone=login burst=1 nodelay;
        proxy_pass $frontend;
    }
}

server {
    listen 80 default_server;
    server_name _;

    # IPs sem túnel (ex.: saída da STW). Pasta vazia = ninguém entra.
    include /etc/nginx/allow/*.allow;
    deny all;

    set $frontend http://auditoria-prod-frontend:3000;

    # Mesmos cabeçalhos do staging.conf (ver comentário lá)
    proxy_set_header Host                 $host;
    proxy_set_header X-Forwarded-Host     $http_host;
    proxy_set_header X-Real-IP            $remote_addr;
    proxy_set_header X-Forwarded-For      $remote_addr;
    proxy_set_header X-Forwarded-Proto    $scheme;

    location / {
        proxy_pass $frontend;
    }

    # Login: mesmo limite do servidor :8080 (a zona é a mesma)
    location = /api/auth/login {
        limit_req zone=login burst=1 nodelay;
        proxy_pass $frontend;
    }
}

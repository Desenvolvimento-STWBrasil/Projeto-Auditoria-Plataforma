# É a porta de entrada pública da aplicação:
# recebe as requisições e direciona cada uma
# para o serviço interno responsável pelo atendimento.

# /nginx/nginx.conf
#
# Versão temporária só com HTTP — ainda não há domínio/certificado.
# Para ativar HTTPS: apontar o domínio para a VM, emitir o certificado
# com certbot (webroot em /var/www/certbot, já servido abaixo) e
# adicionar o bloco "listen 443 ssl; http2 on;" com ssl_certificate.
events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Uploads de evidências (ver backend/app/services/storage.py)
    client_max_body_size 50M;

    proxy_connect_timeout 60s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    server {
        listen 80 default_server;
        server_name _;

        # Desafio do certbot — necessário para emitir o certificado depois.
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Aplicação (rota obrigatória — é como o usuário final acessa o sistema).
        # O Next.js já faz o proxy para o backend internamente; o navegador
        # nunca fala com :8000 diretamente.
        location / {
            proxy_pass         http://frontend:3000;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # Rotas opcionais de operação/observabilidade do backend.
        # Recomendação: restringir por IP (allow/deny) ou remover em produção
        # pública — não são necessárias para o funcionamento da aplicação.
        location /health {
            proxy_pass http://backend:8000/health;
        }

        location /docs {
            # allow 203.0.113.0/24;  # IP do escritório, por exemplo
            # deny all;
            proxy_pass http://backend:8000/docs;
        }

        location /openapi.json {
            proxy_pass http://backend:8000/openapi.json;
        }
    }
}
